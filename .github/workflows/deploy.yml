name: Build & Deploy to hosting

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build app
        run: npm run build

      - name: Deploy dist to 'deploy' branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin deploy || true

          rm -rf /tmp/deploy-dist
          mkdir -p /tmp/deploy-dist
          cp -R dist/. /tmp/deploy-dist/
          cp .cpanel.yml /tmp/deploy-dist/

          git checkout deploy 2>/dev/null || git checkout --orphan deploy
          git rm -rf . > /dev/null 2>&1 || true
          rm -f .gitignore

          cp -R /tmp/deploy-dist/. .
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy"
            exit 0
          fi
          git commit -m "deploy: build ${GITHUB_SHA::7}"
          git push --force origin deploy
